[project]
name = "chzzk-tts"
version = "0.1.0"
description = "치지직(Chzzk) 채팅을 TTS 서비스를 이용하여 읽어주는 프로그램"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "chzzkpy>=1.0",
    "edge-tts>=6.1",
    "google-cloud-texttospeech>=2.16",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
